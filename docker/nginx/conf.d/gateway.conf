# Edge reverse proxy: routes API traffic and each PWA host.
upstream tiles_api { server api:3000; }
upstream tiles_admin { server admin-pwa:80; }
upstream tiles_supplier { server supplier-pwa:80; }
upstream tiles_customer { server customer-pwa:80; }

server {
    # default_server so tunnel hostnames (e.g. *.trycloudflare.com) resolve here too
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://tiles_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tiles_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name supplier.localhost;
    location / { proxy_pass http://tiles_supplier; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://tiles_api; proxy_set_header Host $host; }
}

server {
    listen 80;
    server_name customer.localhost;
    location / { proxy_pass http://tiles_customer; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://tiles_api; proxy_set_header Host $host; }
}
