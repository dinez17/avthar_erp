user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # nginx hashes server_name values into fixed-size buckets, 32 bytes by
    # default. "customer.avtharceramics.co.in" is 29 characters and does not fit
    # once the hash overhead is added, so nginx refuses to start with:
    #
    #     [emerg] could not build server_names_hash, you should increase
    #             server_names_hash_bucket_size: 32
    #
    # 64 comfortably fits any realistic hostname. The cost is a few bytes of
    # memory, which is why nginx asks rather than raising it automatically.
    server_names_hash_bucket_size 64;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    include /etc/nginx/conf.d/*.conf;
}
