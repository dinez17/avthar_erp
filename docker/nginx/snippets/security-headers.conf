# Edge security headers. The API also sets helmet headers; `always` here makes sure
# they are present on error responses too.
#
# HSTS: two years, subdomains included. Do NOT enable this until HTTPS is confirmed
# working on every subdomain — browsers cache it and will refuse plain HTTP after.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(self)" always;
# camera=(self) is deliberate: the barcode scanner needs getUserMedia.
